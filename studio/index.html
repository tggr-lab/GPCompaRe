<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<script>
  // Theme before first paint (no flash). The choice ('light' | 'dark', absent = follow the system) lives in
  // localStorage['gpcompare-studio-theme']; the resolved mode goes on <html data-color-mode>, which the tokens read.
  (function () {
    var root = document.documentElement;
    var stored = null;
    try { stored = localStorage.getItem('gpcompare-studio-theme'); } catch (e) {}
    var choice = stored === 'light' || stored === 'dark' ? stored : 'auto';
    var dark = choice === 'dark' || (choice === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    root.setAttribute('data-color-mode', dark ? 'dark' : 'light');
    root.setAttribute('data-theme-choice', choice);
  })();
</script>
